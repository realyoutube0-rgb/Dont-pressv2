<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DO NOT TOUCH</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at 50% 20%, #3a1464, #12081c 55%, #07040c);
  display: flex;
  align-items: center;
  justify-content: center;
}
button {
  width: 86vw;
  height: 34vw;
  border: none;
  border-radius: 18px;
  background: radial-gradient(circle at 32% 28%, #ff6b6b, #e10600 42%, #8d0000);
  color: #000;
  font: 900 8vw Arial, sans-serif;
  box-shadow: inset 0 18px 24px rgba(255,255,255,.55), 0 12px 24px rgba(0,0,0,.35);
}
body.mad {
  animation: flash .12s steps(2) infinite;
}
@keyframes flash {
  0% { background: #fff; }
  50% { background: #ff0000; }
  100% { background: #0057ff; }
}
</style>
</head>
<body>
<button id="btn">DO NOT TOUCH.</button>
<script>
var on = false;
document.getElementById("btn").onclick = function () {
  if (on) return;
  on = true;
  this.textContent = "Wow. Real mature.";
  document.body.className = "mad";
  var buzz = function () { navigator.vibrate([200, 40, 200, 40, 400]); };
  buzz();
  setInterval(buzz, 900);
  var ctx = new AudioContext();
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = "sawtooth";
  osc.frequency.value = 700;
  gain.gain.value = 0.35;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  setInterval(function () {
    osc.frequency.value = osc.frequency.value === 700 ? 1400 : 700;
  }, 180);
};
</script>
</body>
</html>
